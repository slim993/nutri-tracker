@if (data.ready()) {
  @if (data.error(); as message) {
    <p class="db-error">{{ message }}</p>
  }
  @if (settings.configured()) {
    <main>
      <router-outlet />
    </main>
    <nav class="tabbar">
      @for (tab of tabs; track tab.path) {
        <a [routerLink]="tab.path" routerLinkActive="active">
          <span class="icon">{{ tab.icon }}</span>
          <span class="label">{{ tab.label }}</span>
        </a>
      }
    </nav>
  } @else {
    <!-- Deferred so the form code stays out of the initial bundle for returning users. -->
    @defer {
      <app-welcome />
    }
  }
} @else {
  <p class="loading">{{ t('Chargement…') }}</p>
}
