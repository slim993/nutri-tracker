name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:i18n
      - run: npx ng test --watch=false
      - run: npm run build:pages
      # GitHub Pages has no SPA rewrite: 404.html makes deep links boot the app.
      - run: cp dist/nutri-tracker/browser/index.html dist/nutri-tracker/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/nutri-tracker/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
